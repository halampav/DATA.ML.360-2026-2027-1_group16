    - {name: "Amala Vijayan Pillai Soudha", personal_number: 153106068}

load:
  separator: "::"
  encoding: "latin-1"
  files:
    ratings:
      filename: ratings.dat
      columns: [user_id, item_id, rating, ts]
    movies:
      filename: movies.dat
      columns: [item_id, title, genres]
    users:
      filename: users.dat
      columns: [user_id, gender, age, occupation, zip]

split:
  val_frac: 0.1
  test_frac: 0.1

seed: 42  # random ranker in run_all.py; notebooks/02_tuning.ipynb uses the same value for Optuna

evaluation:
  k: 10                   # cut-off of Precision@k, Recall@k, NDCG@k and catalogue coverage
  relevance_threshold: 4  # a test rating >= this counts as relevant

# Final configurations, chosen on validation in notebooks/02_tuning.ipynb.
# run_all.py trains each of them on train + validation and evaluates it on test.
models:
  most_popular:
    # Several variants, as the assignment asks; the first one had the best validation NDCG@10
    - {only_positive: true, positive_threshold: 4, window_days: 7}
    - {only_positive: true, positive_threshold: 4, window_days: null}
    - {only_positive: false, positive_threshold: 4, window_days: 7}
    - {only_positive: false, positive_threshold: 4, window_days: null}
  item_knn:
    k: 13
    similarity_measure: cosine
    gamma: null       # no significance weighting
    min_support: 20   # see notebooks/02_tuning.ipynb, section 4
