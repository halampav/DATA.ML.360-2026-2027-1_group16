load:
  separator: "::"
  encoding: "latin-1"
  files:
    ratings:
      filename: ratings.dat
      columns: [user_id, item_id, rating, ts]
    movies:
      filename: movies.dat
      columns: [item_id, title, genres]
    users:
      filename: users.dat
      columns: [user_id, gender, age, occupation, zip]

split:
  val_frac: 0.1
  test_frac: 0.1

seed: 42  # random ranker in run_all.py; notebooks/02_tuning.ipynb uses the same value for Optuna

evaluation:
  k: 10                   # cut-off of Precision@k, Recall@k, NDCG@k and catalogue coverage
  relevance_threshold: 4  # a test rating >= this counts as relevant

# Final configurations, chosen on validation in notebooks/02_tuning.ipynb.
# run_all.py trains each of them on train + validation and evaluates it on test.
models:
  most_popular:
    # Several variants, as the assignment asks; the first one had the best validation NDCG@10
    - {only_positive: true, positive_threshold: 4, window_days: 7}
    - {only_positive: true, positive_threshold: 4, window_days: null}
    - {only_positive: false, positive_threshold: 4, window_days: 7}
    - {only_positive: false, positive_threshold: 4, window_days: null}
  item_knn:
    k: 13
    similarity_measure: cosine
    gamma: null       # no significance weighting
    min_support: 20   # see notebooks/02_tuning.ipynb, section 4
  # Part 2 models: best validation NDCG@10 (users with history) in notebooks/03_part2.ipynb, section 1
  # (30 Optuna trials each; all trials in results/part2_tuning_trials.csv)
  user_knn:
    k: 131
    similarity_measure: pearson
    gamma: 100        # largest value in the search space
    min_support: 100
  implicit_als:
    factors: 16       # lower edge of the search space (16-256)
    regularization: 0.001306757868853338
    alpha: 1.1514741512677193
    iterations: 6     # near the lower edge (5-50)
    positive_threshold: 4
    seed: 42
  implicit_bpr:
    factors: 99
    learning_rate: 0.0012368429194827427   # near the lower edge (0.001-0.2)
    regularization: 8.597755025873098e-05
    iterations: 127
    positive_threshold: 4
    seed: 42
  two_tower:
    dim: 64
    embedding_dim: 32
    hidden: 256       # largest value in the search space
    epochs: 9
    batch_size: 1024
    learning_rate: 0.0003646439558980723
    weight_decay: 5.169879442298538e-06
    temperature: 0.0314799191252873
    id_dropout: 0.40109849037701983
    positive_threshold: 4
    seed: 42

part2:
  tuning_trials: 30  # Optuna trials per model in notebooks/03_part2.ipynb, the same budget as ItemKNN in Part 1
  # src/part2_analysis.py (test evaluation of the tuned models)
  seeds: [42, 43, 44, 45, 46]   # stochastic models (ALS, BPR, TwoTower) retrained with each seed
  sparsity_fractions: [0.5, 0.2]  # share of the train + validation ratings kept in the ablation
  sparsity_seeds: [42, 43, 44]  # one random subsample per seed (also the model seed)
